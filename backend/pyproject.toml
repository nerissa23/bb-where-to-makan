[project]
name = "backend"
version = "0.1.0"
description = "FastAPI Backend for BB: Where to Makan?"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.3",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.48.0",
]

[project.optional-dependencies]
http = ["httpx>=0.24.0"]
redis = ["redis>=4.6.0"]
